<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Gamer & Novedades | Level-Up Gamer</title>

  <!-- BOOTSTRAP 5.3.8 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/tienda.css">
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-gamer sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="img/Logo.png" alt="Level-Up Gamer Logo">
        <span class="brand-font fs-4 text-light">LEVEL-UP <span class="text-neon">GAMER</span></span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link active" href="blog.html">Blog Gamer</a></li>
          <li class="nav-item"><a class="nav-link" href="nosotros.html">Quiénes Somos</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        </ul>

        <a href="carrito.html" class="btn btn-outline-neon me-3 position-relative">
          <i class="bi bi-cart3 fs-5"></i>
          <span id="cart-count-badge" class="position-absolute top-0 start-100 translate-middle badge cart-badge">0</span>
        </a>

        <div id="nav-auth-container"></div>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO DEL BLOG GAMER -->
  <main class="container my-4">
    <div class="text-center mb-5">
      <h2 class="brand-font text-neon display-5">BLOG & NOVEDADES GAMER</h2>
      <p class="text-muted fs-5">Noticias, consejos, guías de armado de PC y secretos de la industria.</p>
    </div>

    <!-- LISTADO DE PUBLICACIONES EN EL BLOG -->
    <div class="row g-4" id="contenedor-blogs">
    </div>
  </main>

  <footer class="footer-gamer">
    <div class="container text-center small text-muted">
      Level-Up Gamer &copy; 2026 - Blog Gamer
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/carrito.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const blogs = JSON.parse(localStorage.getItem("blogs")) || [];
      const contenedor = document.getElementById("contenedor-blogs");
      if (contenedor) {
        let html = "";
        blogs.forEach(b => {
          html += `
            <div class="col-md-6">
              <div class="card card-gamer h-100">
                <div class="blog-img-box">
                  <img src="${b.imagen}" alt="${b.titulo}">
                </div>
                <div class="card-body d-flex flex-column">
                  <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="badge bg-primary">${b.autor}</span>
                    <small class="text-muted">${b.fecha}</small>
                  </div>
                  <h4 class="brand-font text-light">${b.titulo}</h4>
                  <p class="text-muted flex-grow-1">${b.resumen}</p>
                  <a href="detalle-blog.html?id=${b.id}" class="btn btn-outline-neon btn-sm align-self-start mt-3">
                    Leer Artículo Completo &rarr;
                  </a>
                </div>
              </div>
            </div>
          `;
        });
        contenedor.innerHTML = html;
      }
    });
  </script>
</body>
</html>
