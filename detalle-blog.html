<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artículo de Blog | Level-Up Gamer</title>

  <!-- BOOTSTRAP 5.3.8 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/tienda.css">
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-gamer sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="img/Logo.png" alt="Level-Up Gamer Logo">
        <span class="brand-font fs-4 text-light">LEVEL-UP <span class="text-neon">GAMER</span></span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link active" href="blog.html">Blog Gamer</a></li>
          <li class="nav-item"><a class="nav-link" href="nosotros.html">Quiénes Somos</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        </ul>

        <a href="carrito.html" class="btn btn-outline-neon me-3 position-relative">
          <i class="bi bi-cart3 fs-5"></i>
          <span id="cart-count-badge" class="position-absolute top-0 start-100 translate-middle badge cart-badge">0</span>
        </a>

        <div id="nav-auth-container"></div>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO DEL DETALLE DE BLOG -->
  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        
        <a href="blog.html" class="btn btn-outline-secondary btn-sm mb-3">&larr; Volver al Blog</a>

        <article class="card card-gamer p-4">
          <h1 class="brand-font text-neon mb-3" id="blog-det-titulo">Cargando artículo...</h1>
          <div class="d-flex gap-3 text-muted small mb-4">
            <span id="blog-det-autor"><i class="bi bi-person"></i> Autor</span>
            <span id="blog-det-fecha"><i class="bi bi-calendar"></i> Fecha</span>
          </div>

          <div class="mb-4 text-center">
            <img id="blog-det-img" src="img/Logo.png" alt="Blog Gamer" class="img-fluid rounded border border-primary" style="max-height: 350px; width: 100%; object-fit: cover;">
          </div>

          <div class="fs-5 text-light lh-lg" id="blog-det-contenido">
            Cargando contenido...
          </div>
        </article>

      </div>
    </div>
  </main>

  <footer class="footer-gamer">
    <div class="container text-center small text-muted">
      Level-Up Gamer &copy; 2026
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/carrito.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get("id")) || 1;

      const blogs = JSON.parse(localStorage.getItem("blogs")) || [];
      const blog = blogs.find(b => b.id === id) || blogs[0];

      if (blog) {
        document.getElementById("blog-det-titulo").innerText = blog.titulo;
        document.getElementById("blog-det-autor").innerHTML = `<i class="bi bi-person"></i> ${blog.autor}`;
        document.getElementById("blog-det-fecha").innerHTML = `<i class="bi bi-calendar"></i> ${blog.fecha}`;
        document.getElementById("blog-det-img").src = blog.imagen;
        document.getElementById("blog-det-contenido").innerText = blog.contenido;
      }
    });
  </script>
</body>
</html>
