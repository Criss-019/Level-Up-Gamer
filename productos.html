<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos | Level-Up Gamer</title>

  <!-- BOOTSTRAP 5.3.8 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/tienda.css">
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-gamer sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="img/Logo.png" alt="Level-Up Gamer Logo">
        <span class="brand-font fs-4 text-light">LEVEL-UP <span class="text-neon">GAMER</span></span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="blog.html">Blog Gamer</a></li>
          <li class="nav-item"><a class="nav-link" href="nosotros.html">Quiénes Somos</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        </ul>

        <a href="carrito.html" class="btn btn-outline-neon me-3 position-relative">
          <i class="bi bi-cart3 fs-5"></i>
          <span id="cart-count-badge" class="position-absolute top-0 start-100 translate-middle badge cart-badge">0</span>
        </a>

        <div id="nav-auth-container"></div>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO DEL CATÁLOGO -->
  <main class="container my-4">
    <h2 class="brand-font mb-4 text-light">Catálogo de <span class="text-neon">Productos Gamer</span></h2>

    <div class="row g-4">
      
      <!-- ! SIDEBAR DE FILTROS AVANZADOS -->
      <div class="col-lg-3">
        <div class="filter-box">
          <h5 class="brand-font text-electric mb-3"><i class="bi bi-funnel"></i> Filtros de Búsqueda</h5>
          
          <!-- Filtro por palabra clave -->
          <div class="mb-3">
            <label for="txtBuscarProducto" class="form-label text-muted small">Buscar Producto</label>
            <input type="text" id="txtBuscarProducto" oninput="aplicarFiltros()" class="form-control form-control-gamer" placeholder="Ej: PlayStation, Mouse...">
          </div>

          <!-- Filtro por Categoría -->
          <div class="mb-3">
            <label for="cboCategoriaFiltro" class="form-label text-muted small">Categoría</label>
            <select id="cboCategoriaFiltro" onchange="aplicarFiltros()" class="form-select form-select-gamer">
              <option value="">Todas las Categorías</option>
              <option value="Juegos de Mesa">Juegos de Mesa</option>
              <option value="Accesorios">Accesorios</option>
              <option value="Consolas">Consolas</option>
              <option value="Computadores Gamers">Computadores Gamers</option>
              <option value="Sillas Gamers">Sillas Gamers</option>
              <option value="Mouse">Mouse</option>
              <option value="Mousepad">Mousepad</option>
              <option value="Poleras Personalizadas">Poleras Personalizadas</option>
              <option value="Polerones Gamers Personalizados">Polerones Gamers</option>
              <option value="Servicio Técnico">Servicio Técnico</option>
            </select>
          </div>

          <!-- Filtro por Precio Máximo -->
          <div class="mb-3">
            <label for="rangePrecio" class="form-label text-muted small d-flex justify-content-between">
              <!-- Largo maximo del precio -->
              <span>Precio Máximo:</span>
              <span id="lblPrecioMaxVal" class="text-neon fw-bold">$1.500.000</span>
            </label>
            <input type="range" class="form-range" id="rangePrecio" min="0" max="1500000" step="10000" value="1500000" oninput="document.getElementById('lblPrecioMaxVal').innerText = formatearPrecio(this.value); aplicarFiltros();">
          </div>

          <button onclick="document.getElementById('txtBuscarProducto').value=''; document.getElementById('cboCategoriaFiltro').value=''; document.getElementById('rangePrecio').value='1500000'; aplicarFiltros();" class="btn btn-outline-secondary btn-sm w-100 mt-2">
            Limpiar Filtros
          </button>
        </div>
      </div>

      <!-- LISTA DE PRODUCTOS -->
      <div class="col-lg-9">
        <div class="row" id="grid-productos">
          <!-- Renderizado dinámicamente mediante productos.js -->
        </div>
      </div>

    </div>
  </main>

  <footer class="footer-gamer">
    <div class="container text-center small text-muted">
      Level-Up Gamer &copy; 2026 - Catálogo de Productos
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/carrito.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      renderizarProductos();
    });
  </script>
</body>
</html>
