  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
      </div>
    </div>
  </nav>

  <div class="admin-wrapper">
    
    <!-- MENÚ LATERAL VERTICAL -->
    <aside class="admin-sidebar">
      <h6 class="brand-font text-muted mb-3 px-2">MENÚ PRINCIPAL</h6>
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link" href="index.html">
            <i class="bi bi-speedometer2"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="productos.html">
            <i class="bi bi-box-seam"></i> Productos

        </li>
        <li class="nav-item">

          </a>
        </li>
      </ul>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="brand-font text-light mb-0"><i class="bi bi-people text-electric"></i> Gestión de <span class="text-electric">Usuarios</span></h2>

          <i class="bi bi-person-plus-fill me-1"></i> Registrar Nuevo Usuario
        </a>

      <div class="card card-gamer p-3">
        <div class="table-responsive">
          <table class="table table-gamer table-hover">
            <thead>
              <tr>
                <th>RUN</th>
                <th>Nombre Completo</th>
                <th>Correo</th>
                <th>Tipo de Usuario</th>
                <th>Región</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tbody-admin-usuarios">
              <!-- Renderizado con admin.js -->
            </tbody>
          </table>
        </div>
      </div>
