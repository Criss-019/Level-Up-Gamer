<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario | Level-Up Gamer</title>

  <!-- BOOTSTRAP 5.3.8 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/tienda.css">
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-gamer sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="img/Logo.png" alt="Level-Up Gamer Logo">
        <span class="brand-font fs-4 text-light">LEVEL-UP <span class="text-neon">GAMER</span></span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="blog.html">Blog Gamer</a></li>
          <li class="nav-item"><a class="nav-link" href="nosotros.html">Quiénes Somos</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        </ul>

        <a href="carrito.html" class="btn btn-outline-neon me-3 position-relative">
          <i class="bi bi-cart3 fs-5"></i>
          <span id="cart-count-badge" class="position-absolute top-0 start-100 translate-middle badge cart-badge">0</span>
        </a>

        <div id="nav-auth-container"></div>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO DEL REGISTRO DE USUARIO -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-7">
        <div class="card card-gamer p-4 shadow-lg">
          
          <div class="text-center mb-4">
            <h3 class="brand-font text-neon"><i class="bi bi-person-plus-fill"></i> REGISTRO DE USUARIO</h3>
            <p class="text-muted small">Únete a la comunidad de Level-Up Gamer y acumula puntos</p>
          </div>

          <!-- FORMULARIO DE REGISTRO CON REGLAS DE NEGOCIO Y VALIDACIÓN JS -->
          <form id="formRegistro" onsubmit="validarRegistro(event)" novalidate>
            
            <div class="row g-3">
              <!-- RUN del usuario -->
              <div class="col-md-6">
                <label for="txtRun" class="form-label text-light">RUN (Sin puntos ni guión)</label>
                <!-- Largo maximo del run -->
                <input type="text" id="txtRun" class="form-control form-control-gamer" placeholder="Ej: 19011022K" maxlength="9">
                <div id="errRun" class="invalid-feedback-custom"></div>
              </div>

              <!-- Correo Electrónico -->
              <div class="col-md-6">
                <label for="txtCorreo" class="form-label text-light">Correo Electrónico</label>
                <input type="email" id="txtCorreo" class="form-control form-control-gamer" placeholder="ejemplo@duoc.cl">
                <div id="errCorreo" class="invalid-feedback-custom"></div>
              </div>

              <!-- Nombre -->
              <div class="col-md-6">
                <label for="txtNombre" class="form-label text-light">Nombre</label>
                <!-- Largo maximo del nombre -->
                <input type="text" id="txtNombre" class="form-control form-control-gamer" placeholder="Tu nombre" maxlength="50">
                <div id="errNombre" class="invalid-feedback-custom"></div>
              </div>

              <!-- Apellidos -->
              <div class="col-md-6">
                <label for="txtApellidos" class="form-label text-light">Apellidos</label>
                <!-- Largo maximo del apellido -->
                <input type="text" id="txtApellidos" class="form-control form-control-gamer" placeholder="Tus apellidos" maxlength="100">
                <div id="errApellidos" class="invalid-feedback-custom"></div>
              </div>

              <!-- Contraseña y Confirmación -->
              <div class="col-md-6">
                <label for="txtPassword" class="form-label text-light">Contraseña</label>
                <input type="password" id="txtPassword" class="form-control form-control-gamer" placeholder="4 a 10 caracteres">
                <div id="errPassword" class="invalid-feedback-custom"></div>
              </div>

              <div class="col-md-6">
                <label for="txtConfirmPassword" class="form-label text-light">Confirmar Contraseña</label>
                <input type="password" id="txtConfirmPassword" class="form-control form-control-gamer" placeholder="Repite contraseña">
                <div id="errConfirmPassword" class="invalid-feedback-custom"></div>
              </div>

              <!-- Fecha de Nacimiento -->
              <div class="col-md-12">
                <label for="txtFechaNacimiento" class="form-label text-light">Fecha de Nacimiento (Debes ser mayor de 18 años)</label>
                <input type="date" id="txtFechaNacimiento" class="form-control form-control-gamer">
                <div id="errFechaNacimiento" class="invalid-feedback-custom"></div>
              </div>

              <!-- ! SELECTOR DINÁMICO DE REGIÓN Y COMUNA -->
              <div class="col-md-6">
                <label for="cboRegion" class="form-label text-light">Región</label>
                <select id="cboRegion" class="form-select form-select-gamer">
                  <option value="">-- Seleccione la región --</option>
                </select>
                <div id="errRegion" class="invalid-feedback-custom"></div>
              </div>

              <div class="col-md-6">
                <label for="cboComuna" class="form-label text-light">Comuna</label>
                <select id="cboComuna" class="form-select form-select-gamer">
                  <option value="">-- Seleccione la comuna --</option>
                </select>
                <div id="errComuna" class="invalid-feedback-custom"></div>
              </div>

              <!-- Dirección -->
              <div class="col-md-12">
                <label for="txtDireccion" class="form-label text-light">Dirección de Despacho</label>
                <!-- Largo maximo de la direccion -->
                <input type="text" id="txtDireccion" class="form-control form-control-gamer" placeholder="Av. Principal #123, Depto 45" maxlength="300">
                <div id="errDireccion" class="invalid-feedback-custom"></div>
              </div>

              <!-- Código de Referido para Puntos LevelUp -->
              <div class="col-md-12">
                <label for="txtReferido" class="form-label text-light">Código de Referido (Opcional - Gana Puntos LevelUp)</label>
                <input type="text" id="txtReferido" class="form-control form-control-gamer" placeholder="Ej: GAMER2026">
              </div>

            </div>

            <!-- Botón de Envío -->
            <button type="submit" class="btn btn-neon w-100 py-2 brand-font fs-6 mt-4">
              <i class="bi bi-check-circle-fill"></i> Registrarme Ahora
            </button>
          </form>

          <div class="text-center mt-3 border-top border-secondary pt-3">
            <span class="text-muted small">¿Ya tienes una cuenta?</span><br>
            <a href="login.html" class="text-electric fw-bold text-decoration-none">Inicia sesión aquí</a>
          </div>

        </div>
      </div>
    </div>
  </main>

  <footer class="footer-gamer">
    <div class="container text-center small text-muted">
      Level-Up Gamer &copy; 2026
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/carrito.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Cargar arreglos dinámicos de regiones y comunas
      cargarRegionesYComunas("cboRegion", "cboComuna");
    });
  </script>
</body>
</html>
